name: build-and-test
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test
      - run: cmake -S . -B build && cmake --build build
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python analysis/validate_synthetic.py /tmp/knurl-synthetic-fixtures
      - run: python analysis/analyze.py /tmp/knurl-synthetic-fixtures --output /tmp/knurl-synthetic-report --validation-only
      - run: make all
      - run: ./knurl-check check --duration .05 --repetitions 2 --memory-bytes 65536 > /tmp/knurl-actual-checkout.json
      - run: python analysis/analyze_checkout.py /tmp/knurl-actual-checkout.json --output /tmp/knurl-checkout-report
      - run: python analysis/validate_checkout.py /tmp/knurl-actual-checkout.json --analysis-dir /tmp/knurl-checkout-report
      - run: ./knurl --work-dir /tmp/knurl-audit-work --output-dir /tmp/knurl-audit-run --mode ci-audit --file-sizes 1048576 --block-sizes 4096 --concurrency 1 --patterns seq-read,seq-write --repetitions 2 --duration .05 --warmup 0
      - run: python analysis/validate_campaign.py /tmp/knurl-audit-run --output /tmp/knurl-audit-validation.json
      - run: python analysis/validate_campaign_fixtures.py /tmp/knurl-audit-run
